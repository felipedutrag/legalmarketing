<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente Dourado Luxo -->
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8A6C22"/>
    </linearGradient>

    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo Circuito Escuro para destaque em abas escuras ou claras -->
  <rect width="100" height="100" rx="22" fill="#07090E"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#fav-gold)" stroke-width="1.5" opacity="0.6"/>

  <!-- ÍCONE ESCUDO + L MONOGRAMA RECORTE -->
  <g transform="translate(2, 2)" filter="url(#fav-shadow)">
    <!-- Escudo Hexagonal Geométrico -->
    <polygon points="48,12 84,30 84,66 48,84 12,66 12,30" fill="#0B0E17" stroke="url(#fav-gold)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Monograma L Minimalista Interno -->
    <path d="M36 34 V60 H60" fill="none" stroke="url(#fav-gold)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 28 V52 H64" fill="none" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
  </g>
</svg>

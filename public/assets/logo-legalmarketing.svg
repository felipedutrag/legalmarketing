<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente Dourado Luxo -->
    <linearGradient id="gold-grad-v3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8A6C22"/>
    </linearGradient>

    <!-- Filtro de Glow Sutil -->
    <filter id="glow-v3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#C9A84C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- NOVO ÍCONE CONCEITUAL: Escudo Geométrico Futurista + Monograma 'L' Interconectado (Sem balança!) -->
  <g transform="translate(15, 12)" filter="url(#glow-v3)">
    <!-- Hexágono/Escudo com Linhas Limpas de Alta Tecnologia -->
    <polygon points="48,8 88,28 88,68 48,88 8,68 8,28" fill="#0B0E17" stroke="url(#gold-grad-v3)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Vértice Interno Abstrato unindo Direito & Estratégia Digital -->
    <path d="M28 32 L48 22 L68 32 L68 54 L48 64 L28 54 Z" fill="none" stroke="url(#gold-grad-v3)" stroke-width="1.2" opacity="0.5"/>
    
    <!-- Monograma L Minimalista Duplo Futurista -->
    <path d="M38 32 V58 H60" fill="none" stroke="url(#gold-grad-v3)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46 26 V50 H64" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- TEXTO DA MARCA COM LARGURA CALIBRADA (G TOTALMENTE VISÍVEL E SEM CORTES) -->
  <g transform="translate(120, 66)">
    <!-- LEGAL (Tipografia Branca Limpa) -->
    <text x="0" y="0" font-family="'Cinzel', 'Georgia', serif" font-size="34" font-weight="700" fill="#F8FAFC" letter-spacing="2">
      LEGAL
    </text>

    <!-- MARKETING (Composição compactada e com margem segura para a letra G) -->
    <text x="135" y="0" font-family="'Cinzel', 'Georgia', serif" font-size="34" font-weight="800" fill="url(#gold-grad-v3)" letter-spacing="2">
      MARKETING
    </text>

    <!-- Subtítulo / Tagline -->
    <text x="2" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#94A3B8" letter-spacing="5">
      ADVOCACIA &amp; ESTRATÉGIA DIGITAL
    </text>
  </g>
</svg>
